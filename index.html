<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="monetag" content="d6d4f636f851d7334d92ded98608b353">
  <title>GamePortal - Play & Connect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- নেভিগেশন বার -->
  <header class="navbar">
    <div class="logo">🎮 GamePortal</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Games</a>
      <a href="#">Community</a>
    </nav>
    <div id="auth-section">
      <button id="login-btn" onclick="loginWithGoogle()">Google দিয়ে লগইন</button>
      <span id="user-info" style="display:none;"></span>
    </div>
  </header>

  <main class="main-container">
    <div class="left-content">
      
      <!-- Hero / Featured Banner -->
      <div class="hero-banner">
        <span class="featured-badge">🔥 Featured Game of the Day</span>
        <h1 id="featured-title">Candy Rope 2D</h1>
      </div>

      <!-- গেইম প্লেয়ার সেকশন -->
      <section class="game-view">
        <div class="iframe-wrapper">
          <iframe id="game-frame" src="games/candy-rope-2d/index.html" title="Unity WebGL Game"></iframe>
        </div>
        <div class="game-controls">
          <h2 id="game-title">Candy Rope 2D</h2>
          <button onclick="toggleFullscreen()">Full Screen ⛶</button>
        </div>
      </section>

      <!-- Monetag Direct Link Reward Banner -->
      <div class="reward-ad-box" style="background: #2a2a40; border: 1px solid #ff4757; border-radius: 8px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin: 15px 0;">
        <div style="color: #fff;">
          <h4 style="margin: 0; font-size: 1.1rem;">🎁 Daily Bonus Rewards</h4>
          <p style="margin: 4px 0 0; color: #a4b0be; font-size: 0.85rem;">Click to unlock free in-game coins & extras!</p>
        </div>
        <a href="https://omg10.com/4/11702034" target="_blank" style="background: #ff4757; color: #fff; padding: 8px 16px; border-radius: 5px; text-decoration: none; font-weight: bold; font-size: 0.9rem;">
          Claim Now ⚡
        </a>
      </div>

      <!-- Banner Ad Slot (728x90 Leaderboard) -->
      <div class="ad-slot banner-ad-slot">
        <span class="ad-label">Advertisement</span>
        <!-- Monetag Banner Ad Script Paste Here -->
      </div>

      <!-- গেইম ক্যাটালগ সেকশন -->
      <section class="game-catalog">
        <h3>Featured Games</h3>
        <div id="game-grid" class="game-grid">
          <!-- JS দিয়ে ডাইনামিকালি লোড হবে -->
        </div>
      </section>

    </div>

    <!-- ডান পাশের চ্যাট ও সাইডবার অ্যাড -->
    <aside class="sidebar-chat">
      <h3>Live Community Chat</h3>
      <div id="chat-messages" class="chat-box"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="মেসেজ লিখুন...">
        <button id="send-btn">Send</button>
      </div>

      <!-- Sidebar Ad Slot (300x250 Medium Rectangle) -->
      <div class="ad-slot sidebar-ad-slot">
        <span class="ad-label">Advertisement</span>
        <!-- Monetag Native / Banner Ad Script Paste Here -->
      </div>
    </aside>
  </main>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script src="app.js"></script>

  <script>
    // Unity Alert Block
    window.alert = function(message) {
      console.log("Blocked Alert: ", message);
    };
  </script>
</body>
</html>
